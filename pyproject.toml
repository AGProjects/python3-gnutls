[build-system]
requires = [
  "setuptools >= 66.1.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "python3-gnutls"
description = "Python wrapper for the GnuTLS library"
# note: the {text = ...} form is needed to build on systems with
# setuptools < 77 (e.g. Debian 12), which does not support the PEP 639
# SPDX string form (license = "LGPL-2.1-or-later")
license = { text = "LGPL-2.1-or-later" }
readme = { file = "README", content-type = "text/plain" }
urls = { source = "https://github.com/AGProjects/python3-gnutls" }

authors = [
	{ name = "Dan Pascu", email = "support@ag-projects.com" }
]

classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
	"Programming Language :: Python",
	"Topic :: Software Development :: Libraries :: Python Modules"
]

dynamic = ["version", "dependencies", "optional-dependencies"]

[tool.setuptools]
platforms = ["Platform Independent"]
# explicit list to avoid automatic flat-layout discovery, which can fail or
# pick up unwanted directories (debian, examples, test) depending on the
# setuptools version
packages = ["gnutls", "gnutls.interfaces", "gnutls.interfaces.twisted", "gnutls.library"]

[tool.setuptools.dynamic]
version = { attr = "gnutls.__version__" }

# Cannot use attr for description: https://github.com/pypa/setuptools/issues/5053
#description = { attr = "gnutls.__summary__" }

dependencies = { file = "requirements.txt" }
optional-dependencies = { tests = { file = "requirements-tests.txt" } }